name: Verify

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, analyze, and build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: xcodebuild -version

      - name: Run canonical verification
        env:
          FAIL_ON_WARNINGS: 1
          VERIFY_ALLOWED_ROOT: ${{ runner.temp }}
          VERIFY_DERIVED_DATA_PATH: ${{ runner.temp }}/CodexStatusBarVerify
          VERIFY_RESULT_BUNDLE_PATH: ${{ runner.temp }}/CodexStatusBarVerify/TestResults.xcresult
          VERIFY_LOG_PATH: ${{ runner.temp }}/CodexStatusBarVerify/verify.log
          VERIFY_COVERAGE_REPORT_PATH: ${{ runner.temp }}/CodexStatusBarVerify/coverage.txt
        run: scripts/verify.sh

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/CodexStatusBarVerify/verify.log
            ${{ runner.temp }}/CodexStatusBarVerify/warnings.txt
            ${{ runner.temp }}/CodexStatusBarVerify/coverage.txt
            ${{ runner.temp }}/CodexStatusBarVerify/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
